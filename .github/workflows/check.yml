name: check

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Install test deps
        run: |
          python -m pip install pytest \
            "fastapi==0.141.1" "python-multipart==0.0.32" \
            "python-dotenv==1.2.3" "openai==3.2.0" "ldap3==2.9.1" "psutil==7.2.2" "python-docx==1.2.0" "openpyxl==3.1.5" "requests-ntlm==1.3.0" "defusedxml==0.7.1" "tokenizers>=0.20,<0.23"
      - name: Pytest
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg MOM_REVISION="$GITHUB_SHA" -t mom:ci .
      - name: Smoke-test running Docker service
        run: |
          set -euo pipefail
          smoke_root=$(mktemp -d)
          mkdir "$smoke_root/data"
          printf '%s\n' 'UI_THEME=classic' 'SMTP_PASSWORD=bootstrap$literal' > "$smoke_root/.env"
          cp "$smoke_root/.env" "$smoke_root/bootstrap.expected"
          trap 'docker logs mom-smoke || true; docker rm -f mom-smoke || true' EXIT
          start_smoke() {
            docker run -d --name mom-smoke -e SETUP_TOKEN=ci-stage1-setup-token \
              -v "$smoke_root/.env:/app/.env:ro" -v "$smoke_root/data:/app/data" \
              -p 127.0.0.1:18080:8000 mom:ci
            ready=0
            for i in $(seq 1 45); do
              if curl --fail --silent http://127.0.0.1:18080/api/health >/tmp/mom-health.json; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" -eq 1
          }
          start_smoke
          python3 - <<'PY'
          import http.cookiejar
          import json
          import os
          import re
          import urllib.request

          root = "http://127.0.0.1:18080"
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )

          def call(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  root + path,
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method=method,
              )
              with opener.open(req, timeout=8) as response:
                  assert response.status == 200, (method, path, response.status)
                  return json.load(response)

          health = call("GET", "/api/health")
          assert health["ok"] and health["ffmpeg"] and health["ui"], health
          with open("frontend/package.json", encoding="utf-8") as manifest:
              version = json.load(manifest)["version"]
          expected = f"Версия v{version} · {os.environ['GITHUB_SHA'][:7]}"
          for path in ("/", "/admin"):
              with opener.open(root + path, timeout=8) as response:
                  html = response.read().decode()
              assert re.search(r'<footer class="build-version">\s*' + re.escape(expected) + r'\s*</footer>', html), path
          assert not call("GET", "/api/auth/status")["configured"]
          setup = call("POST", "/api/auth/setup", {
              "username": "testadmin",
              "password": "container-test-password",
              "setup_token": "ci-stage1-setup-token",
          })
          assert setup["authenticated"]
          assert call("POST", "/api/settings/theme", {"theme": "t2"})["theme"] == "t2"
          monitor = call("GET", "/api/admin/monitoring")
          assert monitor["queue"]["active"] == 0 and monitor["queue"]["jobs"] == [], monitor
          assert monitor["resources"]["rss_bytes"] > 0 and monitor["disk"]["total_bytes"] > 0, monitor
          diagnostics = call("GET", "/api/admin/diagnostics?days=7")
          assert diagnostics["available"] and diagnostics["runs"] == 0, diagnostics
          report = call("GET", "/api/admin/diagnostics/export?days=7")
          assert report["available"] and report["exported_runs"] == 0, report
          user = call("POST", "/api/admin/users", {
              "email": "smoke@example.com",
              "archive_limit": 5,
              "auth_mode": "local",
          })
          assert user["password"]
          session = call("POST", "/api/session/login", {
              "email": "smoke@example.com",
              "password": user["password"],
          })
          assert session["authenticated"]
          assert call("GET", "/api/meetings") == []
          # Text import must work in the production image with no LLM/ASR key.
          import urllib.parse
          payload = urllib.parse.urlencode({
              "title": "Text import smoke",
              "text": "[00:01] Анна: Подготовлю отчёт.\nИван: Проверю завтра.",
          }).encode()
          request = urllib.request.Request(
              root + "/api/meetings/transcript", data=payload,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          with opener.open(request, timeout=8) as response:
              meeting = json.load(response)
          assert meeting["status"] == "review", meeting
          assert meeting["source_type"] == "text"
          assert [s["name"] for s in meeting["speakers"]] == ["Анна", "Иван"]
          assert meeting["segments"][1]["start"] is None
          saved = call("GET", "/api/meetings/" + meeting["id"])
          assert saved["transcript"] == meeting["transcript"]
          assert call("DELETE", "/api/meetings/" + meeting["id"])["ok"]
          PY
          # Performance history is in the existing data volume; a crash trace
          # must be recovered even when its original process has disappeared.
          docker exec -i mom-smoke python - <<'PY'
          from backend import diagnostics
          run = diagnostics.begin_run("private-smoke-meeting", "audio", audio_seconds=60)
          with diagnostics.run_scope(run):
              diagnostics.record_stage("asr", 1.25)
          diagnostics.finish_run(run, status="review")
          diagnostics.begin_run("private-smoke-meeting", "protocol")
          PY
          # Recreate with the same data and original read-only bootstrap file.
          docker rm -f mom-smoke
          start_smoke
          cmp "$smoke_root/.env" "$smoke_root/bootstrap.expected"
          python3 - <<'PY'
          import http.cookiejar
          import json
          import urllib.request

          root = "http://127.0.0.1:18080"
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          with opener.open(root + "/api/health", timeout=8) as response:
              assert json.load(response)["theme"] == "t2"
          request = urllib.request.Request(
              root + "/api/auth/login",
              data=json.dumps({"username": "testadmin", "password": "container-test-password"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with opener.open(request, timeout=8) as response:
              assert json.load(response)["authenticated"]
          with opener.open(root + "/api/admin/diagnostics/export?days=7", timeout=8) as response:
              assert response.headers["Cache-Control"] == "no-store"
              assert "attachment" in response.headers["Content-Disposition"]
              raw = response.read().decode()
              assert "private-smoke-meeting" not in raw
              report = json.loads(raw)
          assert report["exported_runs"] == 2, report
          assert {run["status"] for run in report["runs"]} == {"review", "interrupted"}, report
          assert len({run["meeting"] for run in report["runs"]}) == 1, report
          with open("frontend/package.json", encoding="utf-8") as manifest:
              version = json.load(manifest)["version"]
          assert all(run["app_version"] == version for run in report["runs"]), report
          PY
          docker exec -i mom-smoke python - <<'PY'
          from backend import config
          assert config.ENV_PATH.as_posix() == "/app/data/config/.env"
          assert config.get_ui_theme() == "t2"
          assert config.SMTP_PASSWORD == "bootstrap$literal"
          assert config.ENV_PATH.stat().st_mode & 0o777 == 0o600
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Frontend regression tests
        run: npm test
      - name: Typecheck and build
        run: npm run build

  corporate-nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose --env-file deploy/corporate/env.example -f compose.corporate.yml config --quiet
      - name: Test nginx template, HTTPS and streamed uploads
        run: |
          docker pull nginx:stable-alpine
          python3 tests/smoke_corporate_nginx.py

  corporate-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build corporate image without private wheels or certificates
        run: docker build --build-arg MOM_REVISION="$GITHUB_SHA" -f deploy/corporate/Dockerfile -t mom:corporate-ci .
      - name: Verify corporate image version
        run: docker run --rm --entrypoint grep mom:corporate-ci -F "· ${GITHUB_SHA:0:7}</footer>" /app/backend/static/index.html
