services:
  mom:
    image: ghcr.io/alesnyt/mom:latest
    build:
      context: .
      args:
        MOM_REVISION: ${MOM_REVISION:-}
    ports:
      - "${PORT:-8000}:8000"
    # .env монтируется файлом, не через env_file: в ADMIN_PASSWORD_HASH есть символ $,
    # и Compose иначе подставит его как переменную.
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./.env:/app/.env
    restart: unless-stopped
