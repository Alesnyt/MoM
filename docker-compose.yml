services:
  mom:
    image: ghcr.io/alesnyt/mom:latest
    build:
      context: .
      args:
        MOM_REVISION: ${MOM_REVISION:-}
    ports:
      - "${PORT:-8000}:8000"
    # .env — исходные настройки для первого запуска; затем используется data/config/.env.
    # Не использовать env_file: в ADMIN_PASSWORD_HASH есть символ $.
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./.env:/app/.env:ro
    restart: unless-stopped
