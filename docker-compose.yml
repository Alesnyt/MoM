services:
  mom:
    build:
      context: .
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - http_proxy
        - https_proxy
        - DOCKER_PROXY
    # .env монтируется файлом, не через env_file: в ADMIN_PASSWORD_HASH есть символ $,
    # и Compose иначе подставит его как переменную.
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./.env:/app/.env
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    restart: unless-stopped

  nginx:
    image: ${DOCKER_PROXY}nginx:1.30.5-alpine
    container_name: nginx-momer
    environment:
      - SERVER_NAME=${SERVER_NAME} 
    ports:
      - 80:80
      - 443:443
      - 8000:8000
    restart: always
    depends_on:
      [mom]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs/cert.cer:/etc/nginx/ssl/nginx.crt:ro
      - ./certs/cert_no_pass.key:/etc/nginx/ssl/nginx.key:ro
